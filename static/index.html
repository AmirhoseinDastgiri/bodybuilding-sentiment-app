<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iron Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
  :root {
    --bg: #0d0f12;
    --bg-glow: rgba(255, 106, 61, 0.10);
    --panel: #15181d;
    --panel-2: #1c2027;
    --border: #262b33;
    --text: #e8eaed;
    --muted: #8b929c;
    --accent: #ff6a3d;
    --accent-2: #ffb03d;
    --user-bubble: linear-gradient(135deg, #ff6a3d, #ff8f3d);
    --user-text: #1a0d07;
    --code-bg: #0a0c0f;
    --shadow: 0 10px 30px rgba(0,0,0,.35);
    --overlay: radial-gradient(ellipse at center, rgba(8,9,11,.55), rgba(8,9,11,.80));
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f6f4f1; --bg-glow: rgba(255, 106, 61, 0.12); --panel: #ffffff; --panel-2: #f1eeea;
      --border: #e3ded7; --text: #1d1f23; --muted: #6b6f76; --code-bg: #f3f1ee;
      --shadow: 0 10px 30px rgba(60,40,20,.08); --overlay: radial-gradient(ellipse at center, rgba(246,244,241,.90), rgba(246,244,241,.95));
    }
  }
  :root[data-theme="light"] {
    --bg: #f6f4f1; --bg-glow: rgba(255, 106, 61, 0.12); --panel: #ffffff; --panel-2: #f1eeea;
    --border: #e3ded7; --text: #1d1f23; --muted: #6b6f76; --code-bg: #f3f1ee;
    --shadow: 0 10px 30px rgba(60,40,20,.08); --overlay: radial-gradient(ellipse at center, rgba(246,244,241,.90), rgba(246,244,241,.95));
  }

  * { box-sizing: border-box; }

  /* Brand background photo (static/background.jpg). URL is set from JS so it also
     resolves when the page is opened from a VS Code preview on another port. */
  body::before {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: #000 var(--bg-image, none) center / cover no-repeat;
  }
  /* Overlay so messages stay readable on top of the photo. */
  body::after {
    content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: var(--overlay);
  }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, var(--bg-glow), transparent 70%), var(--bg);
    color: var(--text);
    font: 15px/1.6 "Inter", "Vazirmatn", system-ui, sans-serif;
    display: flex; flex-direction: column;
    isolation: isolate;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    background: color-mix(in srgb, var(--panel) 80%, transparent);
    backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 5;
  }
  .logo {
    width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center;
    background: var(--user-bubble); box-shadow: 0 4px 14px rgba(255,106,61,.35); flex: none;
  }
  .logo svg { width: 22px; height: 22px; }
  .title { font-weight: 700; letter-spacing: -.01em; }
  .subtitle { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #3ddc84; }
  .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--border); background: var(--panel-2); color: var(--text);
    height: 36px; padding: 0 12px; border-radius: 10px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px;
    transition: border-color .15s, transform .1s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.97); }
  .icon-btn svg { width: 16px; height: 16px; }

  .lang {
    display: inline-flex; border: 1px solid var(--border); background: var(--panel-2);
    border-radius: 10px; padding: 3px; gap: 2px; height: 36px;
  }
  .lang button {
    border: 0; background: transparent; color: var(--muted); cursor: pointer;
    font: inherit; font-size: 12.5px; font-weight: 600; min-width: 34px; border-radius: 7px;
    transition: background .15s, color .15s;
  }
  .lang button:hover { color: var(--text); }
  .lang button[aria-pressed="true"] { background: var(--user-bubble); color: var(--user-text); }
  .lang button[data-lang="fa"] { font-family: "Vazirmatn", sans-serif; }

  /* Persian: Vazirmatn first, mirrored send arrow. */
  :root[lang="fa"] body { font-family: "Vazirmatn", "Inter", system-ui, sans-serif; }
  :root[dir="rtl"] .send svg { transform: scaleX(-1); }

  main { flex: 1; overflow-y: auto; scroll-behavior: smooth; }
  .chat { max-width: 820px; margin: 0 auto; padding: 24px 16px 12px; }

  .welcome { text-align: center; padding: 48px 8px 16px; }
  .welcome h1 { font-size: clamp(26px, 5vw, 36px); margin: 0 0 8px; letter-spacing: -.02em; }
  .welcome h1 span {
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .welcome p { color: var(--muted); margin: 0 0 28px; }
  .chips { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; text-align: start; }
  .chip {
    background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
    padding: 14px 16px; cursor: pointer; color: var(--text); font: inherit; text-align: start;
    transition: border-color .15s, transform .15s;
  }
  .chip:hover { border-color: var(--accent); transform: translateY(-2px); }
  .chip b { display: block; font-size: 13.5px; margin-bottom: 2px; }
  .chip small { color: var(--muted); font-size: 12.5px; }

  .msg { display: flex; gap: 12px; margin: 18px 0; animation: rise .25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .msg.user { justify-content: flex-end; }
  .avatar {
    width: 32px; height: 32px; border-radius: 10px; flex: none; display: grid; place-items: center;
    background: var(--panel-2); border: 1px solid var(--border);
  }
  .avatar svg { width: 18px; height: 18px; color: var(--accent); }
  .bubble { max-width: min(680px, 85%); padding: 12px 16px; border-radius: 16px; overflow-wrap: anywhere; }
  .user .bubble { background: var(--user-bubble); color: var(--user-text); border-end-end-radius: 5px; font-weight: 500; white-space: pre-wrap; }
  .bot .bubble { background: var(--panel); border: 1px solid var(--border); border-start-start-radius: 5px; box-shadow: var(--shadow); }
  .bubble > :first-child { margin-top: 0; }
  .bubble > :last-child { margin-bottom: 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 1.05em; margin: 1em 0 .4em; }
  .bubble ul, .bubble ol { padding-inline-start: 1.3em; }
  .bubble li { margin: .2em 0; }
  .bubble strong { color: var(--accent); }
  .bubble code { background: var(--code-bg); padding: 1px 6px; border-radius: 6px; font-size: .9em; }
  .bubble pre { background: var(--code-bg); padding: 12px; border-radius: 10px; overflow-x: auto; }
  .bubble pre code { padding: 0; background: none; }
  .bubble table { border-collapse: collapse; width: 100%; margin: .6em 0; font-size: .92em; display: block; overflow-x: auto; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 6px 10px; text-align: start; }
  .bubble th { background: var(--panel-2); }
  .bubble.error { border-color: #e5484d; color: #e5484d; }

  .typing { display: inline-flex; gap: 4px; padding: 4px 0; }
  .typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing i:nth-child(2) { animation-delay: .2s; }
  .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

  footer { padding: 10px 16px 18px; }
  .composer {
    max-width: 820px; margin: 0 auto; display: flex; align-items: flex-end; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
    padding: 8px; padding-inline-start: 16px; box-shadow: var(--shadow); transition: border-color .15s;
  }
  .composer:focus-within { border-color: var(--accent); }
  textarea {
    flex: 1; resize: none; border: 0; outline: 0; background: transparent; color: var(--text);
    font: inherit; max-height: 180px; padding: 8px 0;
  }
  textarea::placeholder { color: var(--muted); }
  .send {
    width: 40px; height: 40px; border-radius: 12px; border: 0; cursor: pointer; flex: none;
    background: var(--user-bubble); color: #fff; display: grid; place-items: center;
    transition: opacity .15s, transform .1s;
  }
  .send:disabled { opacity: .4; cursor: not-allowed; }
  .send:not(:disabled):active { transform: scale(.94); }
  .send svg { width: 18px; height: 18px; }
  .hint { text-align: center; font-size: 11.5px; color: var(--muted); margin-top: 8px; }

  .title { white-space: nowrap; }
  @media (max-width: 560px) {
    header { padding: 10px 12px; gap: 8px; }
    .subtitle { display: none; }
    .logo { width: 34px; height: 34px; }
    .lang button { min-width: 30px; }
    .btn-label { display: none; }
    .avatar { display: none; }
    .bubble { max-width: 92%; }
  }
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>
  </div>
  <div>
    <div class="title">Iron Coach</div>
    <div class="subtitle"><span class="dot"></span><span data-i18n="subtitle">Your bodybuilding assistant</span></div>
  </div>
  <div class="spacer"></div>
  <div class="lang" id="langSwitch" role="group" aria-label="Language">
    <button type="button" data-lang="en" lang="en">EN</button>
    <button type="button" data-lang="fa" lang="fa">فا</button>
    <button type="button" data-lang="de" lang="de">DE</button>
  </div>
  <button class="icon-btn" id="themeBtn" title="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
  <button class="icon-btn" id="resetBtn" title="Start a new chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    <span class="btn-label" data-i18n="newChat">New chat</span>
  </button>
</header>

<main id="scroller">
  <div class="chat" id="chat"></div>
</main>

<footer>
  <form class="composer" id="form">
    <textarea id="input" rows="1" placeholder="Ask about training, nutrition, supplements…" dir="auto" autofocus></textarea>
    <button class="send" id="sendBtn" type="submit" disabled title="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="hint" data-i18n="hint">Enter to send · Shift+Enter for a new line · Not medical advice</div>
</footer>

<script>
const chat = document.getElementById("chat");
const scroller = document.getElementById("scroller");
const form = document.getElementById("form");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");
let busy = false;
// When opened from the FastAPI server itself, use relative URLs; when opened from a
// VS Code preview or another local port, talk to the server on 127.0.0.1:8000.
const API = location.port === "8000" ? "" : "http://127.0.0.1:8000";
document.documentElement.style.setProperty("--bg-image", `url("${API}/static/background.jpg")`);

const BOT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg>';
const I18N = {
  en: {
    dir: "ltr",
    subtitle: "Your bodybuilding assistant",
    newChat: "New chat", newChatTitle: "Start a new chat", theme: "Toggle theme", send: "Send",
    placeholder: "Ask about training, nutrition, supplements…",
    hint: "Enter to send · Shift+Enter for a new line · Not medical advice",
    welcomeTitle: "Train smarter with <span>Iron Coach</span>",
    welcomeText: "Ask anything about lifting, programming, nutrition and recovery — in English, فارسی or Deutsch.",
    suggestions: [
      ["Build a program", "4-day push/pull/legs split for hypertrophy"],
      ["Cutting diet", "How many calories and protein to lose fat?"],
      ["Fix my bench", "Tips to break a bench press plateau"],
      ["Supplements", "Which supplements are actually worth it?"],
    ],
    confirmReset: "Start a new chat? Your saved conversation will be deleted.",
    offline: "Can't reach the Iron Coach server. Start it with run.bat (or: python server.py) and open http://127.0.0.1:8000",
    empty: "Empty response from the model.",
    generic: "Something went wrong.",
    fileMsg: "**This page was opened as a file.** Double-click `run.bat` in the project folder (or run `python server.py`), then open **http://127.0.0.1:8000**.",
  },
  fa: {
    dir: "rtl",
    subtitle: "دستیار بدنسازی شما",
    newChat: "گفتگوی جدید", newChatTitle: "شروع گفتگوی جدید", theme: "تغییر تم", send: "ارسال",
    placeholder: "درباره تمرین، تغذیه یا مکمل‌ها بپرسید…",
    hint: "Enter برای ارسال · Shift+Enter برای خط جدید · این توصیه پزشکی نیست",
    welcomeTitle: "هوشمندانه‌تر تمرین کنید با <span>Iron Coach</span>",
    welcomeText: "هر سوالی درباره وزنه‌زدن، برنامه تمرینی، تغذیه و ریکاوری دارید بپرسید — به فارسی، English یا Deutsch.",
    suggestions: [
      ["برنامه تمرینی", "یک برنامه ۴ روزه پوش/پول/پا برای حجم عضلانی بنویس"],
      ["رژیم کات", "برای چربی‌سوزی روزانه چقدر کالری و پروتئین لازم دارم؟"],
      ["پرس سینه", "چطور از توقف پیشرفت در پرس سینه عبور کنم؟"],
      ["مکمل‌ها", "کدام مکمل‌ها واقعاً ارزش خرید دارند؟"],
    ],
    confirmReset: "گفتگوی جدید شروع شود؟ گفتگوی ذخیره‌شده شما حذف می‌شود.",
    offline: "اتصال به سرور Iron Coach برقرار نشد. آن را با run.bat (یا python server.py) اجرا کنید و http://127.0.0.1:8000 را باز کنید.",
    empty: "پاسخی از مدل دریافت نشد.",
    generic: "مشکلی پیش آمد.",
    fileMsg: "**این صفحه به‌صورت فایل باز شده است.** فایل `run.bat` را در پوشه پروژه اجرا کنید (یا `python server.py`) و سپس **http://127.0.0.1:8000** را باز کنید.",
  },
  de: {
    dir: "ltr",
    subtitle: "Dein Bodybuilding-Assistent",
    newChat: "Neuer Chat", newChatTitle: "Neuen Chat starten", theme: "Design wechseln", send: "Senden",
    placeholder: "Frag nach Training, Ernährung, Supplements…",
    hint: "Enter zum Senden · Shift+Enter für neue Zeile · Keine medizinische Beratung",
    welcomeTitle: "Trainiere smarter mit <span>Iron Coach</span>",
    welcomeText: "Frag alles zu Krafttraining, Trainingsplänen, Ernährung und Regeneration — auf Deutsch, English oder فارسی.",
    suggestions: [
      ["Trainingsplan", "Erstelle einen 4-Tage Push/Pull/Beine-Split für Muskelaufbau"],
      ["Diät", "Wie viele Kalorien und wie viel Protein brauche ich zum Fettabbau?"],
      ["Bankdrücken", "Tipps, um ein Plateau beim Bankdrücken zu überwinden"],
      ["Supplements", "Welche Supplements lohnen sich wirklich?"],
    ],
    confirmReset: "Neuen Chat starten? Dein gespeicherter Verlauf wird gelöscht.",
    offline: "Der Iron-Coach-Server ist nicht erreichbar. Starte ihn mit run.bat (oder: python server.py) und öffne http://127.0.0.1:8000",
    empty: "Leere Antwort vom Modell.",
    generic: "Etwas ist schiefgelaufen.",
    fileMsg: "**Diese Seite wurde als Datei geöffnet.** Doppelklicke `run.bat` im Projektordner (oder führe `python server.py` aus) und öffne dann **http://127.0.0.1:8000**.",
  },
};

function detectLang() {
  const fromUrl = new URLSearchParams(location.search).get("lang");
  if (I18N[fromUrl]) return fromUrl;
  try { const saved = localStorage.getItem("lang"); if (I18N[saved]) return saved; } catch {}
  const nav = (navigator.language || "en").slice(0, 2).toLowerCase();
  return I18N[nav] ? nav : "en";
}
let lang = detectLang();
const t = key => I18N[lang][key];

function applyLang() {
  const root = document.documentElement;
  root.lang = lang;
  root.dir = t("dir");
  document.querySelectorAll("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  input.placeholder = t("placeholder");
  sendBtn.title = t("send");
  document.getElementById("themeBtn").title = t("theme");
  document.getElementById("resetBtn").title = t("newChatTitle");
  document.querySelectorAll("#langSwitch button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  if (document.getElementById("welcome")) showWelcome(); // re-render welcome in the new language
}

document.querySelectorAll("#langSwitch button").forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch {}
  applyLang();
  input.focus();
});

function render(md) {
  if (window.marked && window.DOMPurify) return DOMPurify.sanitize(marked.parse(md));
  const d = document.createElement("div"); d.textContent = md; return d.innerHTML.replace(/\n/g, "<br>");
}

function scrollDown() { scroller.scrollTop = scroller.scrollHeight; }

function showWelcome() {
  chat.innerHTML = `
    <div class="welcome" id="welcome">
      <h1>${t("welcomeTitle")}</h1>
      <p>${t("welcomeText")}</p>
      <div class="chips"></div>
    </div>`;
  const chips = chat.querySelector(".chips");
  for (const [title, question] of t("suggestions")) {
    const c = document.createElement("button");
    c.className = "chip";
    c.innerHTML = "<b></b><small></small>";
    c.querySelector("b").textContent = title;
    c.querySelector("small").textContent = question;
    c.onclick = () => send(question);
    chips.append(c);
  }
}

function addMessage(role, content) {
  document.getElementById("welcome")?.remove();
  const row = document.createElement("div");
  row.className = `msg ${role}`;
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.dir = "auto";
  if (role === "user") bubble.textContent = content;
  else bubble.innerHTML = content === null ? '<span class="typing"><i></i><i></i><i></i></span>' : render(content);
  if (role === "bot") {
    const av = document.createElement("div"); av.className = "avatar"; av.innerHTML = BOT_ICON; row.append(av);
  }
  row.append(bubble);
  chat.append(row);
  scrollDown();
  return bubble;
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  busy = true; updateSend();
  input.value = ""; autosize();
  addMessage("user", text);
  const bubble = addMessage("bot", null);

  try {
    const res = await fetch(API + "/api/chat", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text, lang }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Server error ${res.status}`);
    }
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let answer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      answer += decoder.decode(value, { stream: true });
      bubble.innerHTML = render(answer);
      scrollDown();
    }
    if (!answer) throw new Error(t("empty"));
  } catch (e) {
    bubble.classList.add("error");
    const offline = e instanceof TypeError; // fetch() throws TypeError when the server can't be reached
    bubble.textContent = offline ? t("offline") : (e.message || t("generic"));
  } finally {
    busy = false; updateSend(); input.focus();
  }
}

function autosize() { input.style.height = "auto"; input.style.height = input.scrollHeight + "px"; }
function updateSend() { sendBtn.disabled = busy || !input.value.trim(); }

input.addEventListener("input", () => { autosize(); updateSend(); });
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(input.value); }
});
form.addEventListener("submit", e => { e.preventDefault(); send(input.value); });

document.getElementById("resetBtn").onclick = async () => {
  if (busy || !confirm(t("confirmReset"))) return;
  await fetch(API + "/api/reset", { method: "POST" });
  showWelcome();
};

const root = document.documentElement;
// Dark by default so the black/gold background photo looks as designed.
root.dataset.theme = "dark";
try { const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved; } catch {}
document.getElementById("themeBtn").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  root.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", root.dataset.theme); } catch {}
};

applyLang();

(async () => {
  if (location.protocol === "file:") {
    showWelcome();
    addMessage("bot", t("fileMsg"));
    return;
  }
  try {
    const history = await (await fetch(API + "/api/history")).json();
    if (!history.length) return showWelcome();
    history.forEach(m => addMessage(m.role === "user" ? "user" : "bot", m.content));
  } catch { showWelcome(); }
})();
</script>
</body>
</html>
