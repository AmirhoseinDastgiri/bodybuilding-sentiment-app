<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review Sentiment</title>
<style>
  :root {
    --bg: #0d1117; --bg-2: #131a24; --card: #161e2b; --card-2: #1c2636; --line: #263246;
    --text: #e6edf3; --muted: #8b98ab; --accent: #7c8cff; --accent-2: #a78bfa;
    --pos: #34d399; --pos-bg: rgba(52, 211, 153, .12);
    --neg: #f87171; --neg-bg: rgba(248, 113, 113, .12);
    --neu: #fbbf24; --neu-bg: rgba(251, 191, 36, .12);
    --shadow: 0 10px 40px rgba(0, 0, 0, .35);
  }
  [data-theme="light"] {
    --bg: #f4f6fb; --bg-2: #eaeef7; --card: #ffffff; --card-2: #f6f8fc; --line: #dde3ee;
    --text: #18202c; --muted: #5d6b80; --accent: #4f5bd5; --accent-2: #7c3aed;
    --pos: #059669; --pos-bg: rgba(5, 150, 105, .10);
    --neg: #dc2626; --neg-bg: rgba(220, 38, 38, .09);
    --neu: #b45309; --neu-bg: rgba(217, 119, 6, .11);
    --shadow: 0 10px 30px rgba(30, 45, 80, .10);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font: 15px/1.55 "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(900px 500px at 10% -10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 60%),
      radial-gradient(800px 500px at 110% 10%, color-mix(in srgb, var(--accent-2) 14%, transparent), transparent 60%),
      var(--bg);
    background-attachment: fixed;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 16px 60px; }
  header { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .logo {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: var(--shadow);
  }
  h1 { font-size: 22px; margin: 0; letter-spacing: -.01em; }
  .sub { color: var(--muted); font-size: 13.5px; }
  .spacer { flex: 1; }
  .icon-btn {
    border: 1px solid var(--line); background: var(--card); color: var(--text); width: 40px; height: 40px;
    border-radius: 10px; cursor: pointer; display: grid; place-items: center;
  }
  .icon-btn:hover { border-color: var(--accent); }

  .grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 20px; align-items: start; }
  @media (max-width: 880px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; box-shadow: var(--shadow); }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; font-weight: 600; }

  textarea {
    width: 100%; min-height: 170px; resize: vertical; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card-2); color: var(--text); font: inherit; outline: none;
  }
  textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .samples { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
  .chip {
    border: 1px dashed var(--line); background: transparent; color: var(--muted); border-radius: 999px;
    padding: 5px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .actions { display: flex; align-items: center; gap: 12px; }
  .btn {
    border: 0; border-radius: 12px; padding: 12px 22px; font: inherit; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:disabled { opacity: .55; cursor: progress; }
  .hint { color: var(--muted); font-size: 12.5px; }
  .count { margin-inline-start: auto; color: var(--muted); font-size: 12.5px; }
  .spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; animation: spin .7s linear infinite; display: none; }
  .btn:disabled .spinner { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* verdict */
  .verdict { display: flex; align-items: center; gap: 18px; padding: 18px; border-radius: 14px; background: var(--card-2); border: 1px solid var(--line); }
  .verdict.positive { background: var(--pos-bg); border-color: color-mix(in srgb, var(--pos) 40%, transparent); }
  .verdict.negative { background: var(--neg-bg); border-color: color-mix(in srgb, var(--neg) 40%, transparent); }
  .verdict.neutral  { background: var(--neu-bg); border-color: color-mix(in srgb, var(--neu) 40%, transparent); }
  .code {
    width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; flex: none;
    font-size: 30px; font-weight: 800; color: #fff; background: var(--muted);
  }
  .positive .code { background: var(--pos); } .negative .code { background: var(--neg); } .neutral .code { background: var(--neu); }
  .vlabel { font-size: 24px; font-weight: 700; text-transform: capitalize; line-height: 1.2; }
  .vmeta { color: var(--muted); font-size: 13.5px; margin-top: 2px; }
  .empty { color: var(--muted); text-align: center; padding: 34px 10px; }

  .steps { margin-top: 18px; display: grid; gap: 12px; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; background: var(--card-2); }
  .step.active { border-color: var(--accent); }
  .step-head { display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 10px; }
  .num { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; background: var(--line); color: var(--text); }
  .step.active .num { background: var(--accent); color: #fff; }
  .tag { margin-inline-start: auto; font-size: 11.5px; font-weight: 600; padding: 3px 9px; border-radius: 999px; background: var(--line); color: var(--muted); }
  .step.active .tag { background: color-mix(in srgb, var(--accent) 20%, transparent); color: var(--accent); }

  .bar-row { display: grid; grid-template-columns: 74px 1fr 48px; align-items: center; gap: 10px; font-size: 13px; margin: 6px 0; }
  .bar-row .name { color: var(--muted); text-transform: capitalize; }
  .bar-row .pct { text-align: end; font-variant-numeric: tabular-nums; }
  .track { position: relative; height: 10px; border-radius: 999px; background: var(--line); overflow: visible; }
  .fill { height: 100%; border-radius: 999px; width: 0; transition: width .5s ease; }
  .fill.positive { background: var(--pos); } .fill.negative { background: var(--neg); } .fill.neutral { background: var(--neu); }
  .thr { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .55; border-radius: 2px; }
  .legend { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .reason { font-size: 14px; }
  .note { margin-top: 12px; font-size: 13px; color: var(--neu); }

  /* history */
  .history { margin-top: 20px; }
  .hist-list { display: grid; gap: 8px; max-height: 340px; overflow-y: auto; }
  .hist { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card-2); cursor: pointer; }
  .hist:hover { border-color: var(--accent); }
  .hist .mini { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: 13px; flex: none; }
  .hist .mini.positive { background: var(--pos); } .hist .mini.negative { background: var(--neg); } .hist .mini.neutral { background: var(--neu); }
  .hist .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13.5px; }
  .hist .by { font-size: 11.5px; color: var(--muted); flex: none; }

  .info { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 20px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .stat .k { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .stat .v { font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-word; }
  .codes { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-top: 12px; }
  .codes b { color: var(--text); }
  .err { color: var(--neg); font-size: 13.5px; margin-top: 10px; min-height: 1em; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 10h.01M12 10h.01M16 10h.01"/></svg>
    </div>
    <div>
      <h1>Review Sentiment</h1>
      <div class="sub">Hybrid classifier · local model first, LLM when it is unsure</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="theme" title="Toggle theme" aria-label="Toggle theme"></button>
  </header>

  <div class="grid">
    <section>
      <div class="card">
        <h2>Amazon review</h2>
        <textarea id="text" placeholder="Paste or type a product review…" maxlength="5000"></textarea>
        <div class="samples" id="samples"></div>
        <div class="actions">
          <button class="btn" id="go"><span class="spinner"></span><span>Analyze</span></button>
          <span class="hint">Ctrl + Enter</span>
          <span class="count" id="count">0 / 5000</span>
        </div>
        <div class="err" id="err"></div>
        <div class="codes"><span><b>1</b> positive</span><span><b>2</b> negative</span><span><b>3</b> neutral</span></div>
      </div>

      <div class="info" id="info"></div>
    </section>

    <section>
      <div class="card">
        <h2>Decision</h2>
        <div id="result"><div class="empty">Enter a review and press Analyze.</div></div>
      </div>
      <div class="card history">
        <h2>This session</h2>
        <div class="hist-list" id="hist"><div class="hint">No reviews analyzed yet.</div></div>
      </div>
    </section>
  </div>
</div>

<script>
  // Works when served by the app (port 8001) and from previews on other local ports.
  const API = location.port === "8001" ? "" : "http://127.0.0.1:8001";
  const $ = (id) => document.getElementById(id);
  const LABELS = ["positive", "negative", "neutral"];
  const SAMPLES = [
    ["Positive", "Works perfectly in my phone, fast transfer speeds and plenty of space. Would buy again!"],
    ["Negative", "Stopped working after two weeks and lost all my photos. Complete waste of money."],
    ["Mixed", "It does the job, but speeds are slower than advertised. Fine for the price I guess."],
  ];
  let info = null;
  const history = [];

  // ---------- theme
  const sun = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
  const moon = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
  function setTheme(t) {
    document.documentElement.dataset.theme = t;
    $("theme").innerHTML = t === "dark" ? sun : moon;
    try { localStorage.setItem("sentiment-theme", t); } catch {}
  }
  let saved = null; try { saved = localStorage.getItem("sentiment-theme"); } catch {}
  setTheme(saved || "dark");
  $("theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");

  // ---------- helpers
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const pct = (x) => (x == null ? "–" : Math.round(x * 100) + "%");

  SAMPLES.forEach(([name, text]) => {
    const c = el("button", "chip", name + " example");
    c.onclick = () => { $("text").value = text; updateCount(); $("text").focus(); };
    $("samples").append(c);
  });
  const updateCount = () => { $("count").textContent = $("text").value.length + " / 5000"; };
  $("text").addEventListener("input", updateCount);
  $("text").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) analyze(); });
  $("go").onclick = analyze;

  // ---------- info
  async function loadInfo() {
    try {
      info = await (await fetch(API + "/api/info")).json();
      const m = info.test_metrics;
      const stats = [
        ["Local model", info.local_model.replaceAll("_", " ")],
        ["Test macro-F1", m.macro_f1.toFixed(3)],
        ["Test accuracy", pct(m.accuracy)],
        ["LLM threshold", "< " + pct(info.threshold)],
        ["LLM", info.llm_enabled ? info.llm_model : "off (no API key)"],
      ];
      $("info").replaceChildren(...stats.map(([k, v]) => { const s = el("div", "stat"); s.append(el("div", "k", k), el("div", "v", v)); return s; }));
    } catch { $("err").textContent = "Cannot reach the server at " + (API || location.origin) + "."; }
  }

  // ---------- analyze
  async function analyze() {
    const text = $("text").value.trim();
    if (!text) { $("err").textContent = "Please enter a review."; return; }
    $("err").textContent = "";
    $("go").disabled = true;
    try {
      const r = await fetch(API + "/api/sentiment", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ text }) });
      if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
      const res = await r.json();
      render(res);
      history.unshift({ text, res });
      renderHistory();
    } catch (e) {
      $("err").textContent = "Error: " + e.message;
    } finally {
      $("go").disabled = false;
    }
  }

  function render(res) {
    const byLLM = res.decided_by === "llm";
    const v = el("div", "verdict " + res.label);
    const body = el("div");
    body.append(el("div", "vlabel", res.label),
      el("div", "vmeta", `Code ${res.code} · ${pct(res.confidence)} confidence · decided by ${byLLM ? "OpenAI " + res.llm.model : "local model"}`));
    v.append(el("div", "code", String(res.code)), body);

    // step 1: local
    const s1 = el("div", "step" + (byLLM ? "" : " active"));
    const h1 = el("div", "step-head"); h1.append(el("span", "num", "1"), el("span", null, "Local classifier"), el("span", "tag", byLLM ? "unsure" : "decided"));
    s1.append(h1);
    LABELS.forEach((l) => {
      const row = el("div", "bar-row");
      const track = el("div", "track"); const fill = el("div", "fill " + l); const thr = el("div", "thr");
      thr.style.insetInlineStart = (res.threshold * 100) + "%";
      track.append(fill, thr);
      row.append(el("span", "name", l), track, el("span", "pct", pct(res.local.probabilities[l])));
      s1.append(row);
      requestAnimationFrame(() => requestAnimationFrame(() => { fill.style.width = (res.local.probabilities[l] * 100) + "%"; }));
    });
    s1.append(el("div", "legend", `Marker = ${pct(res.threshold)} threshold. Below it, the review is sent to the LLM.`));

    // step 2: llm
    const s2 = el("div", "step" + (byLLM ? " active" : ""));
    const h2 = el("div", "step-head"); h2.append(el("span", "num", "2"), el("span", null, "LLM"), el("span", "tag", byLLM ? "decided" : "skipped"));
    s2.append(h2);
    if (byLLM) s2.append(el("div", "reason", res.llm.reason || "—"));
    else s2.append(el("div", "hint", res.note ? "Not used." : "Not needed: the local model was confident."));

    const steps = el("div", "steps"); steps.append(s1, s2);
    const nodes = [v, steps];
    if (res.note) nodes.push(el("div", "note", res.note));
    $("result").replaceChildren(...nodes);
  }

  function renderHistory() {
    $("hist").replaceChildren(...history.slice(0, 30).map(({ text, res }) => {
      const h = el("div", "hist");
      h.append(el("span", "mini " + res.label, String(res.code)), el("span", "txt", text), el("span", "by", res.decided_by === "llm" ? "LLM" : "local"));
      h.onclick = () => { $("text").value = text; updateCount(); render(res); };
      return h;
    }));
  }

  loadInfo();
</script>
</body>
</html>
